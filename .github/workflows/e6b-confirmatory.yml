name: E6b Confirmatory Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "e6b/**"
      - ".github/workflows/e6b-confirmatory.yml"

permissions:
  contents: read

jobs:
  frozen-e6b:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ASSET_DIR: ${{ runner.temp }}/e6b_assets
      WORK_DIR: ${{ runner.temp }}/e6b_work
      OUT_DIR: ${{ github.workspace }}/e6b_confirmatory_results
      BENCH_COMMIT: e21d49c2cb61d147a46c5966f2581bf6fd422b9f
      VAL_COMMIT: 3c7a1f330bdab0ba28a4762bb45c3f06c27fb6d4
      FD_VERSION: "26.6"

    steps:
      - name: Checkout Tianshu
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake flex bison curl git python3 nodejs unzip

      - name: Reconstruct byte-preserved frozen research bundle
        run: |
          mkdir -p "$ASSET_DIR" "$WORK_DIR" "$OUT_DIR"
          cat e6b/bundle_parts/part-*.b64 > "$RUNNER_TEMP/e6b_bundle.b64"
          base64 --decode "$RUNNER_TEMP/e6b_bundle.b64" > "$RUNNER_TEMP/E6b_External_Validity_Gate_Research_Bundle_v1.1.zip"
          echo "8ff25602bcabc58eed52b781d882d51966dd02dc28b02ebf77db1166ca59d9ac  $RUNNER_TEMP/E6b_External_Validity_Gate_Research_Bundle_v1.1.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/E6b_External_Validity_Gate_Research_Bundle_v1.1.zip" -d "$ASSET_DIR"
          cd "$ASSET_DIR"
          sha256sum -c E6b_ARTIFACTS_SHA256.txt
          python3 -m py_compile run_e6b_external_validity_gate_v1_1.py
          node --check generate_e6b_independent_oracle.mjs

      - name: Checkout frozen IPC-3 benchmark
        run: |
          git clone https://github.com/aibasel/downward-benchmarks.git "$WORK_DIR/downward-benchmarks"
          git -C "$WORK_DIR/downward-benchmarks" checkout --detach "$BENCH_COMMIT"
          test "$(git -C "$WORK_DIR/downward-benchmarks" rev-parse HEAD)" = "$BENCH_COMMIT"

      - name: Build Fast Downward 26.6
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://www.fast-downward.org/latest/files/release26.6/fast-downward-26.6.tar.gz" \
            -o "$WORK_DIR/fast-downward-26.6.tar.gz"
          tar -xzf "$WORK_DIR/fast-downward-26.6.tar.gz" -C "$WORK_DIR"
          cd "$WORK_DIR/fast-downward-26.6"
          ./build.py
          ./fast-downward.py --version | tee "$OUT_DIR/fast_downward_version.txt"
          test "$(./fast-downward.py --version 2>&1 | head -n 1)" = "Fast Downward 26.6"

      - name: Build frozen VAL
        run: |
          git clone https://github.com/KCL-Planning/VAL.git "$WORK_DIR/VAL"
          git -C "$WORK_DIR/VAL" checkout --detach "$VAL_COMMIT"
          test "$(git -C "$WORK_DIR/VAL" rev-parse HEAD)" = "$VAL_COMMIT"
          cd "$WORK_DIR/VAL"
          bash scripts/linux/build_linux64.sh
          VAL_BIN="$(find build -type f \( -name Validate -o -name validate \) -perm -u+x | head -n 1)"
          test -n "$VAL_BIN"
          printf '%s\n' "$WORK_DIR/VAL/$VAL_BIN" > "$OUT_DIR/val_binary_path.txt"

      - name: Reproduce independent JavaScript oracle
        run: |
          node "$ASSET_DIR/generate_e6b_independent_oracle.mjs" \
            "$WORK_DIR/downward-benchmarks" \
            "$OUT_DIR/e6b_oracle_reproduced.json"

      - name: Run frozen audit-only preflight
        run: |
          python3 "$ASSET_DIR/run_e6b_external_validity_gate_v1_1.py" \
            --bench-root "$WORK_DIR/downward-benchmarks" \
            --oracle-manifest "$ASSET_DIR/E6b_Independent_Oracle_Manifest_v1.0.json" \
            --out "$OUT_DIR/audit" \
            --audit-only

      - name: Run frozen Full/GSC confirmatory pairs
        id: gate
        continue-on-error: true
        run: |
          VAL_BIN="$(cat "$OUT_DIR/val_binary_path.txt")"
          set +e
          python3 "$ASSET_DIR/run_e6b_external_validity_gate_v1_1.py" \
            --bench-root "$WORK_DIR/downward-benchmarks" \
            --oracle-manifest "$ASSET_DIR/E6b_Independent_Oracle_Manifest_v1.0.json" \
            --fast-downward "$WORK_DIR/fast-downward-26.6/fast-downward.py" \
            --val "$VAL_BIN" \
            --val-source-root "$WORK_DIR/VAL" \
            --out "$OUT_DIR/confirmatory"
          rc=$?
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$OUT_DIR/runner_exit_code.txt"
          exit "$rc"

      - name: Record execution integrity hashes
        if: always()
        run: |
          if [ -d "$OUT_DIR" ]; then
            cd "$OUT_DIR"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > RESULT_SHA256.txt || true
          fi

      - name: Write scientific status to job summary
        if: always()
        run: |
          echo "## E6b confirmatory gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Frozen runner exit code: ${{ steps.gate.outputs.runner_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT_DIR/confirmatory/gate_summary.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT_DIR/confirmatory/gate_summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gate_summary.json was produced. This is an infrastructure failure, not a scientific FAIL/INCONCLUSIVE result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve raw confirmatory outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6b-confirmatory-${{ github.run_id }}
          path: e6b_confirmatory_results/**
          if-no-files-found: warn
          retention-days: 90

      - name: Separate infrastructure status from scientific status
        if: always()
        run: |
          if [ ! -f "$OUT_DIR/confirmatory/gate_summary.json" ]; then
            echo "Infrastructure failure: frozen runner did not produce gate_summary.json" >&2
            exit 20
          fi
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['OUT_DIR'],'confirmatory','gate_summary.json')
          s=json.load(open(p))
          status=s.get('status')
          print('Scientific gate status:', status)
          if status not in {'PASS','FAIL','INCONCLUSIVE'}:
              raise SystemExit('Unexpected scientific gate status')
          PY
